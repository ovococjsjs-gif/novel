<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Белый пеликан с большим оранжевым клювом едет направо на бирюзовом велосипеде по просёлочной дороге.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8efff"/>
      <stop offset="0.65" stop-color="#eef9ff"/>
      <stop offset="1" stop-color="#fdfaf1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbe7b8"/>
      <stop offset="1" stop-color="#a9d493"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#e4d9c6"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9dfcd"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffc874"/>
      <stop offset="0.55" stop-color="#f6a33c"/>
      <stop offset="1" stop-color="#e07f26"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffdc94"/>
      <stop offset="1" stop-color="#f7b44e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3fb6ad"/>
      <stop offset="1" stop-color="#1f8580"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d7a52" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5d7a52" stop-opacity="0"/>
    </radialGradient>
    <g id="wheel">
      <circle cx="0" cy="0" r="86" fill="none" stroke="#3a3a45" stroke-width="13"/>
      <circle cx="0" cy="0" r="78" fill="none" stroke="#8d99a3" stroke-width="5"/>
      <g stroke="#b7c2ca" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-76" x2="0" y2="76"/>
        <line x1="-76" y1="0" x2="76" y2="0"/>
        <line x1="-53.7" y1="-53.7" x2="53.7" y2="53.7"/>
        <line x1="-53.7" y1="53.7" x2="53.7" y2="-53.7"/>
        <line x1="-26.3" y1="-71.3" x2="26.3" y2="71.3"/>
        <line x1="-71.3" y1="-26.3" x2="71.3" y2="26.3"/>
        <line x1="-26.3" y1="71.3" x2="26.3" y2="-71.3"/>
        <line x1="-71.3" y1="26.3" x2="71.3" y2="-26.3"/>
      </g>
      <circle cx="0" cy="0" r="11" fill="#5b6672" stroke="#3a3a45" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#cdd6dc"/>
    </g>
  </defs>

  <!-- фон -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="652" cy="118" r="96" fill="url(#sunGlow)"/>
  <circle cx="652" cy="118" r="44" fill="#ffe28a"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="152" cy="140" rx="58" ry="27"/>
    <ellipse cx="196" cy="124" rx="40" ry="30"/>
    <ellipse cx="112" cy="126" rx="32" ry="22"/>
    <ellipse cx="596" cy="222" rx="44" ry="18"/>
    <ellipse cx="630" cy="212" rx="28" ry="20"/>
  </g>
  <path d="M0 452 C 130 396 246 420 352 436 C 470 454 606 392 800 430 L800 600 L0 600 Z" fill="url(#ground)"/>
  <path d="M0 452 C 130 396 246 420 352 436 C 470 454 606 392 800 430" fill="none" stroke="#9ac785" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 520 C 180 500 520 500 800 516 L800 552 C 520 536 180 536 0 556 Z" fill="#e8e0cf" opacity="0.85"/>
  <path d="M0 520 C 180 500 520 500 800 516" fill="none" stroke="#cfc4ad" stroke-width="4"/>

  <!-- движение -->
  <g stroke="#9ec9e8" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="26" y1="300" x2="120" y2="300"/>
    <line x1="8" y1="342" x2="132" y2="342"/>
    <line x1="40" y1="384" x2="122" y2="384"/>
  </g>
  <g fill="#a6cf8e" opacity="0.8">
    <path d="M60 540 l10 -30 l10 30 z"/>
    <path d="M96 546 l8 -24 l8 24 z"/>
    <path d="M726 552 l10 -28 l10 28 z"/>
    <path d="M764 546 l8 -22 l8 22 z"/>
  </g>

  <!-- тень -->
  <ellipse cx="415" cy="536" rx="268" ry="30" fill="url(#groundShadow)"/>

  <!-- дальняя нога и дальняя педаль -->
  <g stroke-linecap="round" fill="none">
    <path d="M340 306 L368 360 L382 420" stroke="#7a3f13" stroke-width="20"/>
    <path d="M340 306 L368 360 L382 420" stroke="#c46e28" stroke-width="13"/>
  </g>
  <g>
    <path d="M412 440 L382 422" stroke="#7c8894" stroke-width="8" stroke-linecap="round"/>
    <rect x="360" y="414" width="34" height="10" rx="4" transform="rotate(-13 377 419)" fill="#4a4a56" stroke="#3a3a45" stroke-width="3"/>
    <path d="M382 410 c 10 0 18 6 14 12 l -26 4 c -8 -4 -2 -16 12 -16 z" fill="#cf7c33" stroke="#8a4a12" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- колёса -->
  <use href="#wheel" x="268" y="430"/>
  <use href="#wheel" x="566" y="430"/>

  <!-- рама -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7c8894" stroke-width="4">
      <path d="M412 416 L268 421"/>
      <path d="M412 468 L268 439"/>
    </g>
    <path d="M412 416 L268 421 M412 468 L268 439" stroke="#aab4bc" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M268 430 L412 428" stroke="url(#frame)" stroke-width="13"/>
    <path d="M268 430 L412 428" stroke="#175f5b" stroke-width="13" opacity="0.18"/>
    <path d="M362 306 L268 430" stroke="url(#frame)" stroke-width="12"/>
    <path d="M412 442 L362 306" stroke="url(#frame)" stroke-width="14"/>
    <path d="M412 442 L534 372" stroke="url(#frame)" stroke-width="14"/>
    <path d="M362 306 L528 300" stroke="url(#frame)" stroke-width="12"/>
    <path d="M528 300 L548 372" stroke="url(#frame)" stroke-width="15"/>
    <path d="M548 372 C 558 396 564 412 566 430" stroke="#2b9b93" stroke-width="12"/>
    <path d="M542 372 C 552 396 558 412 560 430" stroke="#3fb6ad" stroke-width="7"/>
    <!-- седло -->
    <path d="M330 302 C 348 290 384 292 394 302 C 380 312 344 314 330 302 Z" fill="#4a4a56" stroke="#2b2b33" stroke-width="3"/>
    <!-- вынос -->
    <path d="M528 300 L546 262" stroke="#5b6672" stroke-width="9"/>
  </g>

  <!-- фляга -->
  <g>
    <rect x="424" y="352" width="24" height="46" rx="10" transform="rotate(38 436 375)" fill="#f4f7f8" stroke="#3a3a45" stroke-width="3"/>
    <rect x="428" y="356" width="24" height="15" rx="7" transform="rotate(38 440 363)" fill="#5fc0b6" stroke="#3a3a45" stroke-width="2.5"/>
    <rect x="434" y="376" width="12" height="6" rx="3" transform="rotate(38 440 379)" fill="#c9d3d8"/>
  </g>

  <!-- шатун со звездой -->
  <g>
    <circle cx="412" cy="440" r="27" fill="none" stroke="#8d99a3" stroke-width="6"/>
    <circle cx="412" cy="440" r="27" fill="none" stroke="#5b6672" stroke-width="2" stroke-dasharray="3 6"/>
    <circle cx="412" cy="440" r="9" fill="#5b6672" stroke="#3a3a45" stroke-width="3"/>
  </g>

  <!-- руль -->
  <g fill="none" stroke-linecap="round">
    <path d="M506 268 C 524 254 572 254 594 266" stroke="#3a3a45" stroke-width="11"/>
    <path d="M506 264 C 524 251 572 251 594 263" stroke="#7c8894" stroke-width="4" opacity="0.7"/>
  </g>
  <g>
    <rect x="584" y="256" width="20" height="17" rx="8" transform="rotate(12 594 264)" fill="#2b2b33"/>
    <rect x="499" y="258" width="18" height="16" rx="8" transform="rotate(-12 508 266)" fill="#2b2b33"/>
  </g>

  <!-- хвост -->
  <g>
    <path d="M290 288 C 258 274 220 256 194 240 C 208 262 200 268 180 272 C 206 282 202 292 182 302 C 214 306 254 316 290 318 Z"
          fill="url(#wingGrad)" stroke="#3a3a45" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M276 296 C 246 286 222 274 204 262 M274 306 C 242 300 218 292 198 286" fill="none" stroke="#c9bda8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- корпус -->
  <g>
    <ellipse cx="352" cy="268" rx="96" ry="76" transform="rotate(-10 352 268)" fill="url(#body)" stroke="#3a3a45" stroke-width="4"/>
    <path d="M300 330 C 340 344 396 340 432 318" fill="none" stroke="#d8cbb5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ближняя нога к педали -->
  <g stroke-linecap="round" fill="none">
    <path d="M356 316 L406 380 L438 448" stroke="#7a3f13" stroke-width="22"/>
    <path d="M356 316 L406 380 L438 448" stroke="#e8913e" stroke-width="15"/>
    <circle cx="406" cy="380" r="8.5" fill="#e8913e" stroke="#b8611f" stroke-width="3"/>
  </g>
  <g>
    <path d="M412 440 L446 456" stroke="#7c8894" stroke-width="9" stroke-linecap="round"/>
    <rect x="430" y="450" width="36" height="11" rx="4" fill="#5b6672" stroke="#3a3a45" stroke-width="3"/>
    <path d="M450 440 c 13 0 21 11 9 15 l -24 3 c -11 -3 -6 -16 5 -18 z" fill="#f2a34a" stroke="#b8611f" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M436 449 l 8 4 M448 447 l 8 4" stroke="#b8611f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- тень от крыла на теле -->
  <ellipse cx="372" cy="292" rx="92" ry="16" fill="#cbbda6" opacity="0.45"/>

  <!-- крыло -->
  <g>
    <path d="M300 250 C 360 218 462 220 538 242 C 560 249 574 264 552 274 C 508 288 428 292 366 284 C 322 279 294 268 300 250 Z"
          fill="url(#wingGrad)" stroke="#3a3a45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M350 270 C 414 281 478 279 540 265 M370 253 C 428 258 486 254 530 245" fill="none" stroke="#cbc0ab" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M514 248 C 534 251 548 259 550 267" fill="none" stroke="#3a3a45" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M494 285 C 508 281 518 276 526 270 M472 288 C 486 284 496 280 504 275" fill="none" stroke="#c2b6a0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- шея -->
  <g fill="none" stroke-linecap="round">
    <path d="M374 244 C 394 178 424 142 470 130" stroke="#3a3a45" stroke-width="56"/>
    <path d="M374 244 C 394 178 424 142 470 130" stroke="url(#body)" stroke-width="47"/>
  </g>

  <!-- голова -->
  <g>
    <circle cx="484" cy="132" r="38" fill="url(#body)" stroke="#3a3a45" stroke-width="4"/>
    <path d="M456 102 C 448 86 462 74 474 86 C 480 78 496 78 494 94" fill="url(#body)" stroke="#3a3a45" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- клюв -->
  <g>
    <!-- мешок -->
    <path d="M506 140 C 536 196 600 216 650 158 C 604 146 556 136 506 140 Z" fill="url(#pouch)" stroke="#8a4a12" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- надклювье -->
    <path d="M502 106 C 562 102 622 124 652 150 C 660 156 657 165 649 162 C 598 140 550 133 502 138 Z"
          fill="url(#beakTop)" stroke="#8a4a12" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- крючок на конце -->
    <path d="M649 160 C 664 163 668 174 655 178 C 647 178 643 170 645 163 Z" fill="#e07f26" stroke="#8a4a12" stroke-width="3" stroke-linejoin="round"/>
    <!-- продольная линия и ноздря -->
    <path d="M516 132 C 566 130 610 138 646 152" fill="none" stroke="#c07a26" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M500 122 c 8 -3 16 -3 22 0" fill="none" stroke="#8a4a12" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- складка мешка -->
    <path d="M536 158 C 558 188 602 196 634 174" fill="none" stroke="#cf7c22" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- глаз -->
  <g>
    <circle cx="496" cy="116" r="7.5" fill="#2b2b33"/>
    <circle cx="499" cy="113" r="2.6" fill="#ffffff"/>
    <path d="M484 104 C 492 97 506 97 512 103" fill="none" stroke="#3a3a45" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
