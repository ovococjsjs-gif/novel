<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600" width="800" height="600">
  <title>Пеликан на велосипеде</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66bfe6"/>
      <stop offset="0.55" stop-color="#b9e4f5"/>
      <stop offset="1" stop-color="#fff0cc"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7c4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff7c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff7c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57b6d6"/>
      <stop offset="1" stop-color="#2f8db6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dfb2"/>
      <stop offset="1" stop-color="#e3c48c"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcb5c"/>
      <stop offset="1" stop-color="#f2963a"/>
    </linearGradient>

    <!-- силуэт тела (используется для заливки, обводки и теней) -->
    <path id="body" d="M290 270C292 228 333 192 392 188C440 185 470 200 478 230C486 262 466 296 428 306C395 314 340 310 308 301C295 296 289 284 290 270Z"/>
    <path id="neck" d="M416 212C410 180 424 148 448 124L490 126C484 150 476 182 476 228Z"/>
    <ellipse id="head" cx="468" cy="110" rx="27" ry="21" transform="rotate(-10 468 110)"/>
    <path id="thigh" d="M386 300C404 300 424 310 436 324Q441 332 432 334Q431 341 422 339Q418 344 411 338C399 331 388 321 382 310Z"/>
    <clipPath id="bodyClip"><use xlink:href="#body"/></clipPath>
    <clipPath id="thighClip"><use xlink:href="#thigh"/></clipPath>
    <clipPath id="neckClip"><use xlink:href="#neck"/></clipPath>

    <!-- перепончатая лапа; (0,0) — центр педали -->
    <g id="foot">
      <path d="M-16 -7Q-16 -18 -2 -18L29 -15Q35 -12 30 -9Q26 -8 31 -5Q35 -2 29 0Q25 0 27 4Q27 8 21 6L-11 -2Q-16 -3 -16 -7Z"
            stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M3 -13L28 -12M3 -10L28 -3M1 -7L21 3" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- спицы (24 шт., тангенциальная шнуровка) -->
    <path id="spokes" fill="none" stroke="#a9b0ba" stroke-width="1.3" stroke-linecap="round"
          d="M-6.8 -1.8L0 -73.5M7 0L19 -71M-4.9 -4.9L36.7 -63.7M6.1 3.5L52 -52M-1.8 -6.8L63.7 -36.8M3.5 6.1L71 -19M1.8 -6.8L73.5 0M0 7L71 19M4.9 -4.9L63.7 36.7M-3.5 6.1L52 52M6.8 -1.8L36.7 63.7M-6.1 3.5L19 71M6.8 1.8L0 73.5M-7 0L-19 71M4.9 4.9L-36.8 63.7M-6.1 -3.5L-52 52M1.8 6.8L-63.7 36.8M-3.5 -6.1L-71 19M-1.8 6.8L-73.5 0M0 -7L-71 -19M-4.9 4.9L-63.7 -36.8M3.5 -6.1L-52 -52M-6.8 1.8L-36.8 -63.7M6.1 -3.5L-19 -71"/>

    <g id="wheel">
      <circle r="85" fill="none" stroke="#25242b" stroke-width="12"/>
      <circle r="85" fill="none" stroke="#3b3a44" stroke-width="2" stroke-dasharray="3 5"/>
      <circle r="76" fill="none" stroke="#cdd2da" stroke-width="5"/>
      <circle r="73.5" fill="none" stroke="#8a919b" stroke-width="1"/>
      <use xlink:href="#spokes"/>
      <circle r="8" fill="#dde1e6" stroke="#5a606a" stroke-width="2"/>
      <circle r="3" fill="#5a606a"/>
    </g>
  </defs>

  <!-- ===== ФОН ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="120" cy="96" r="95" fill="url(#sunGlow)"/>
  <circle cx="120" cy="96" r="40" fill="#ffe17a"/>

  <g fill="#ffffff" opacity="0.92">
    <path d="M222 92c0-14 14-24 28-20 6-12 24-16 34-6 12-6 28 2 28 16 12 0 18 10 14 18H226c-6 0-8-4-4-8z"/>
    <path d="M626 70c0-16 16-26 30-22 8-14 30-16 40-4 14-6 32 4 30 18 14 0 20 12 14 20H632c-8 0-10-6-6-12z"/>
    <path d="M690 168c0-10 10-16 19-13 5-9 19-10 26-2 9-4 20 3 19 11 9 0 12 8 9 13H694c-5 0-7-4-4-9z" opacity="0.8"/>
  </g>

  <!-- чайки -->
  <g fill="none" stroke="#4a5866" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 54q7-7 14 0q7-7 14 0"/>
    <path d="M598 80q5-5 10 0q5-5 10 0"/>
  </g>

  <!-- море -->
  <rect y="400" width="800" height="110" fill="url(#sea)"/>
  <path d="M0 400H800" stroke="#9fd8ea" stroke-width="2"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M40 425q10-5 20 0t20 0"/>
    <path d="M150 448q10-5 20 0t20 0"/>
    <path d="M610 432q10-5 20 0t20 0"/>
    <path d="M690 470q10-5 20 0t20 0"/>
    <path d="M60 480q10-5 20 0t20 0"/>
  </g>
  <!-- парусник на горизонте -->
  <g transform="translate(700 380)">
    <path d="M-14 16h30l-5 6h-21z" fill="#3c4a5a"/>
    <path d="M0 -14v29h13z" fill="#ffffff" stroke="#3c4a5a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-2 -8v23h-10z" fill="#f2f2f2" stroke="#3c4a5a" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- набережная -->
  <rect y="500" width="800" height="100" fill="url(#ground)"/>
  <rect y="500" width="800" height="10" fill="#cfb183"/>
  <path d="M0 510H800" stroke="#b39463" stroke-width="2"/>
  <g stroke="#d5b885" stroke-width="2" stroke-linecap="round">
    <path d="M0 575H800"/>
    <path d="M60 510l-20 90M200 510l-14 90M340 510l-6 90M480 510l4 90M620 510l12 90M760 510l20 90"/>
  </g>

  <!-- линии скорости и пыль -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M40 250H130"/>
    <path d="M70 290H170"/>
    <path d="M30 330H110"/>
  </g>
  <g fill="#fff8e8" opacity="0.85">
    <circle cx="132" cy="543" r="9"/>
    <circle cx="112" cy="538" r="6"/>
    <circle cx="96" cy="546" r="4"/>
  </g>

  <!-- тень -->
  <ellipse cx="395" cy="553" rx="240" ry="9" fill="#5b4520" opacity="0.22"/>

  <!-- ===== ДАЛЬНЯЯ СТОРОНА ===== -->
  <!-- дальняя нога -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="383,303 400,398 346,479" stroke="#3a2a24" stroke-width="15"/>
    <polyline points="383,303 400,398 346,479" stroke="#d27a2e" stroke-width="10"/>
  </g>
  <!-- дальний шатун и педаль -->
  <path d="M385 470L350.4 490" stroke="#3d4149" stroke-width="9" stroke-linecap="round"/>
  <path d="M385 470L350.4 490" stroke="#8d939c" stroke-width="5" stroke-linecap="round"/>
  <rect x="338" y="486.5" width="25" height="7" rx="2" fill="#2c2f36"/>
  <use xlink:href="#foot" transform="translate(350.4 490)" fill="#d27a2e" stroke="#3a2a24"/>

  <!-- ===== ВЕЛОСИПЕД ===== -->
  <use xlink:href="#wheel" x="235" y="460"/>
  <use xlink:href="#wheel" x="555" y="460"/>

  <!-- подседельный штырь -->
  <path d="M342 337L333 309" stroke="#454a52" stroke-width="9" stroke-linecap="round"/>
  <path d="M342 337L333 309" stroke="#b7bdc6" stroke-width="5" stroke-linecap="round"/>

  <!-- рама: обводка, затем цвет -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#6b1c1a">
      <path stroke-width="12" d="M385 470L235 460M344 342L235 460M385 470L342 337M342 337L517 327M523 346L385 470"/>
      <path stroke-width="11" d="M529 368C537 397 545 428 555 460"/>
      <path stroke-width="16" d="M515 320L529 368"/>
    </g>
    <g stroke="#e2453b">
      <path stroke-width="7.5" d="M385 470L235 460M344 342L235 460M385 470L342 337M342 337L517 327M523 346L385 470"/>
      <path stroke-width="6.5" d="M529 368C537 397 545 428 555 460"/>
      <path stroke-width="11.5" d="M515 320L529 368"/>
    </g>
    <path stroke="#ff9a8c" stroke-width="2" opacity="0.8" d="M350 334L505 325M512 352L398 455"/>
  </g>

  <!-- вынос и руль -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M515 321L509 297C505 293 500 291 492 291" stroke="#454a52" stroke-width="9"/>
    <path d="M515 321L509 297C505 293 500 291 492 291" stroke="#c3c9d1" stroke-width="5"/>
    <path d="M495 291L479 292" stroke="#1f1e24" stroke-width="11"/>
  </g>
  <circle cx="509.5" cy="297.5" r="3.6" fill="#8f96a0" stroke="#454a52" stroke-width="1.6"/>

  <!-- оси колёс -->
  <circle cx="555" cy="460" r="5" fill="#d9dde3" stroke="#4f545c" stroke-width="2"/>

  <!-- цепь -->
  <path d="M384.4 446L234.7 450A10 10 0 0 0 233.4 469.9L381.2 493.7A24 24 0 1 0 384.4 446Z"
        fill="none" stroke="#3f434b" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M384.4 446L234.7 450A10 10 0 0 0 233.4 469.9L381.2 493.7A24 24 0 1 0 384.4 446Z"
        fill="none" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="3 2.4"/>
  <!-- задняя звёздочка -->
  <circle cx="235" cy="460" r="10" fill="#a2a9b2" stroke="#4f545c" stroke-width="2"/>
  <circle cx="235" cy="460" r="3" fill="#4f545c"/>
  <!-- передняя звёздочка -->
  <circle cx="385" cy="470" r="27.5" fill="none" stroke="#6f7680" stroke-width="3.5" stroke-dasharray="2.6 2.4"/>
  <circle cx="385" cy="470" r="25" fill="#c2c8d0" stroke="#4f545c" stroke-width="2"/>
  <circle cx="385" cy="470" r="16" fill="none" stroke="#8b929b" stroke-width="2"/>
  <g stroke="#8b929b" stroke-width="4" stroke-linecap="round">
    <path d="M385 470l0-16M385 470l15.2-4.9M385 470l9.4 12.9M385 470l-9.4 12.9M385 470l-15.2-4.9"/>
  </g>

  <!-- седло -->
  <path d="M305 305c0-6 14-8 28-6l24 4c5 1 5 6 0 7l-38 4c-9 1-14-3-14-9z"
        fill="#5a3322" stroke="#2a1a12" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ближний шатун и педаль -->
  <path d="M385 470L419.6 450" stroke="#3d4149" stroke-width="10" stroke-linecap="round"/>
  <path d="M385 470L419.6 450" stroke="#cfd4db" stroke-width="6" stroke-linecap="round"/>
  <circle cx="385" cy="470" r="4" fill="#4f545c"/>
  <rect x="407" y="446.5" width="25" height="7" rx="2" fill="#2c2f36"/>
  <rect x="426" y="448" width="5" height="4" rx="1" fill="#ff8c2a"/>

  <!-- ===== ПЕЛИКАН ===== -->
  <!-- ближняя нога (бедро прячется в оперении) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="400,309 472,363 414,441" stroke="#2a2730" stroke-width="15"/>
    <polyline points="400,309 472,363 414,441" stroke="#f5993b" stroke-width="10"/>
    <path d="M466 362l4 3" stroke="#d9772a" stroke-width="3"/>
  </g>
  <use xlink:href="#foot" transform="translate(420 450)" fill="#f5993b" stroke="#2a2730"/>

  <!-- хвост -->
  <path d="M300 256C286 249 270 246 258 249C251 252 252 260 260 262C251 266 251 274 259 276C254 282 261 288 271 286C283 286 293 284 302 281Z"
        fill="#eef1f6" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
  <path d="M261 262C273 262 285 264 297 267M260 276C272 274 284 274 296 276" fill="none" stroke="#9aa3b0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- шарф: концы развеваются -->
  <g fill="#ffcc33" stroke="#2a2730" stroke-width="2.5" stroke-linejoin="round">
    <path d="M420 172C398 160 372 154 346 160C330 164 316 158 302 148C310 168 328 178 346 178C370 178 394 182 418 188Z"/>
    <path d="M420 182C400 184 382 192 364 204C352 212 338 212 326 208C336 222 354 224 368 216C388 206 402 196 422 192Z"/>
  </g>

  <!-- хохолок (за головой) -->
  <path d="M456 94C446 84 432 81 417 84C425 87 430 90 434 93C425 94 417 97 411 103C421 102 429 103 437 105C431 108 426 112 423 118C433 115 443 112 452 110Z"
        fill="#fbf7ea" stroke="#2a2730" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- тело, бедро, шея, голова: общая обводка, затем заливка поверх -->
  <g fill="#2a2730" stroke="#2a2730" stroke-width="6" stroke-linejoin="round">
    <use xlink:href="#body"/>
    <use xlink:href="#thigh"/>
    <use xlink:href="#neck"/>
    <use xlink:href="#head"/>
  </g>
  <g fill="#ffffff">
    <use xlink:href="#body"/>
    <use xlink:href="#thigh"/>
    <use xlink:href="#neck"/>
    <use xlink:href="#head"/>
  </g>
  <!-- объём: тени на брюхе и шее -->
  <g clip-path="url(#bodyClip)" fill="#c9d3e2" opacity="0.6">
    <ellipse cx="380" cy="330" rx="120" ry="48"/>
  </g>
  <g clip-path="url(#thighClip)" fill="#c9d3e2" opacity="0.6">
    <ellipse cx="404" cy="346" rx="40" ry="18" transform="rotate(37 404 346)"/>
  </g>
  <g clip-path="url(#neckClip)" fill="#dbe2ec" opacity="0.8">
    <ellipse cx="405" cy="175" rx="22" ry="60"/>
  </g>
  <!-- намёк на перья -->
  <g fill="none" stroke="#b9c2cf" stroke-width="1.8" stroke-linecap="round">
    <path d="M318 236q6 5 13 4M334 222q6 5 13 4M312 258q6 5 13 4"/>
  </g>


  <!-- шарф: обмотка на шее -->
  <path d="M418 166C440 176 462 178 485 170L486 186C462 194 440 192 419 182Z"
        fill="#ffcc33" stroke="#2a2730" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M424 176C444 184 464 185 484 179" fill="none" stroke="#e0a91a" stroke-width="2"/>

  <!-- подклювный мешок -->
  <path d="M492 120C530 132 572 146 604 157C596 178 566 200 532 202C506 203 488 186 482 160C480 146 484 128 492 120Z"
        fill="url(#pouch)" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
  <path d="M500 150C520 170 548 182 576 176M498 136C520 150 548 160 580 162" fill="none" stroke="#d97b26" stroke-width="1.6" opacity="0.7"/>

  <!-- надклювье -->
  <path d="M486 98C530 108 580 128 616 146C623 150 624 158 618 162C614 158 610 156 604 156C566 146 524 130 492 120Z"
        fill="#f7b23e" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
  <path d="M492 104C534 114 576 130 610 148" fill="none" stroke="#e0742c" stroke-width="2" stroke-linecap="round"/>
  <path d="M612 149C618 152 620 157 617 160" fill="none" stroke="#c4471f" stroke-width="3" stroke-linecap="round"/>

  <!-- глаз -->
  <ellipse cx="472" cy="105" rx="9.5" ry="8" fill="#f9c99c"/>
  <circle cx="473" cy="105" r="4.8" fill="#1d1b22"/>
  <circle cx="474.8" cy="103.2" r="1.7" fill="#ffffff"/>

  <!-- ближнее крыло -->
  <!-- второстепенные маховые (тёмные, с фестонами) -->
  <path d="M366 250C380 270 410 284 440 285C458 286 472 280 484 268L490 280Q482 292 470 290Q462 298 450 293Q440 300 428 293Q416 298 406 290Q392 292 386 282Q372 280 368 266Z"
        fill="#34313b" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
  <!-- кроющие перья -->
  <path d="M364 228C382 208 432 204 460 226C472 236 480 250 484 262C474 276 450 284 424 283C398 282 374 272 364 256C358 246 358 236 364 228Z"
        fill="#f6f8fb" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
  <path d="M384 258q10 8 22 7M410 266q10 6 22 4M436 268q9 4 18 1M396 238q9 7 20 6M422 244q9 6 20 4" fill="none" stroke="#b9c2cf" stroke-width="1.8" stroke-linecap="round"/>
  <!-- первостепенные маховые — «пальцы» на руле -->
  <g fill="#2c2a33" stroke="#2a2730" stroke-width="2" stroke-linejoin="round">
    <path d="M462 244C480 252 494 268 499 286C501 295 494 299 490 293C486 280 476 268 460 260Z"/>
    <path d="M462 258C478 266 489 280 492 294C493 301 486 303 483 297C480 287 472 277 458 270Z"/>
    <path d="M458 270C471 278 480 290 481 300C481 307 474 307 473 301C471 293 465 286 452 280Z"/>
  </g>
  <path d="M470 254C482 262 490 274 494 286" fill="none" stroke="#5d5a66" stroke-width="1.5" stroke-linecap="round"/>
</svg>
