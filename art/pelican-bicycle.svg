<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600" width="800" height="600">
  <title>Пеликан на велосипеде</title>
  <desc>Плоская векторная иллюстрация: белый пеликан с большим оранжевым клювом едет на красном велосипеде по набережной у моря.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb2e4"/>
      <stop offset="0.62" stop-color="#a9dcf2"/>
      <stop offset="1" stop-color="#fdf1d0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffe883" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa8d4"/>
      <stop offset="1" stop-color="#2d90bf"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dba6"/>
      <stop offset="1" stop-color="#e7c785"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fabf52"/>
      <stop offset="1" stop-color="#ec8c1c"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd073"/>
      <stop offset="1" stop-color="#f0a02c"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4574e"/>
      <stop offset="1" stop-color="#cf2f28"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f5f8fb"/>
      <stop offset="1" stop-color="#e3eaf1"/>
    </linearGradient>
    <linearGradient id="wing" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbfdfe"/>
      <stop offset="1" stop-color="#dde6ee"/>
    </linearGradient>
    <linearGradient id="legNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ae4a"/>
      <stop offset="1" stop-color="#e8912c"/>
    </linearGradient>

    <g id="spokes" stroke="#b6c2ce" stroke-width="2.2">
      <line x1="0" y1="-92" x2="0" y2="92"/>
      <line x1="-88" y1="-27" x2="88" y2="27"/>
      <line x1="-88" y1="27" x2="88" y2="-27"/>
      <line x1="-27" y1="-88" x2="27" y2="88"/>
      <line x1="27" y1="-88" x2="-27" y2="88"/>
      <line x1="-92" y1="0" x2="92" y2="0"/>
    </g>

    <g id="wheel">
      <circle cx="0" cy="0" r="104" fill="none" stroke="#3b4149" stroke-width="13"/>
      <circle cx="0" cy="0" r="94" fill="none" stroke="#cfd8e0" stroke-width="7"/>
      <use xlink:href="#spokes" href="#spokes"/>
      <circle cx="0" cy="0" r="10" fill="#eaf0f6" stroke="#8c98a5" stroke-width="3.5"/>
    </g>
  </defs>

  <!-- ============================= фон ============================= -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="112" cy="92" r="112" fill="url(#sunGlow)"/>
  <circle cx="112" cy="92" r="44" fill="#ffdc5e"/>

  <g fill="#ffffff" opacity="0.93">
    <path d="M212 132c6-20 30-27 44-13 5-16 27-21 38-8 13-7 27 3 27 15z"/>
    <path d="M556 92c7-20 32-27 46-13 6-16 29-20 40-8 14-6 29 3 29 16z"/>
    <path d="M636 168c5-14 23-19 32-9 6-11 21-13 28-4 10-4 21 3 21 14z"/>
    <path d="M296 62c4-11 18-15 25-7 5-8 17-10 22-3 8-3 16 2 16 11z" opacity="0.75"/>
  </g>
  <g stroke="#54626f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M498 138c7-7 14-7 21 0"/>
    <path d="M534 158c6-6 12-6 18 0"/>
    <path d="M700 118c7-7 14-7 21 0"/>
  </g>

  <!-- ============================= море ============================= -->
  <rect x="0" y="404" width="800" height="64" fill="url(#sea)"/>
  <g stroke="#93d6ee" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M58 436c9-8 19-8 28 0s19 8 28 0"/>
    <path d="M116 462c8-7 17-7 26 0"/>
    <path d="M664 432c9-8 19-8 28 0"/>
    <path d="M712 464c8-7 17-7 26 0"/>
  </g>
  <g transform="translate(706 366)">
    <path d="M0 26 L0 0" stroke="#5b6a78" stroke-width="2"/>
    <path d="M0 0 L-17 21 L0 19 Z" fill="#ffffff" stroke="#5b6a78" stroke-width="2"/>
    <path d="M0 0 L16 21 L0 19 Z" fill="#eef4f8" stroke="#5b6a78" stroke-width="2"/>
    <path d="M-14 26 L14 26 L9 31 L-9 31 Z" fill="#8a97a4" stroke="#5b6a78" stroke-width="2"/>
  </g>

  <!-- ============================= набережная ============================= -->
  <rect x="0" y="466" width="800" height="134" fill="url(#sand)"/>
  <rect x="0" y="466" width="800" height="7" fill="#d8b675"/>
  <g stroke="#d3b073" stroke-width="2.5" opacity="0.75">
    <path d="M96 473 L96 600"/>
    <path d="M286 473 L272 600"/>
    <path d="M474 473 L482 600"/>
    <path d="M660 473 L682 600"/>
    <path d="M0 522 L800 514"/>
    <path d="M0 568 L800 562"/>
  </g>
  <ellipse cx="418" cy="580" rx="228" ry="13" fill="#c5a067" opacity="0.4"/>

  <!-- ============================= велосипед ============================= -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#wheel" href="#wheel" x="238" y="468"/>
    <use xlink:href="#wheel" href="#wheel" x="608" y="468"/>

    <!-- цепь -->
    <path d="M238 455 L410 442 M238 481 L410 494" stroke="#96a2af" stroke-width="5" fill="none"/>
    <circle cx="410" cy="468" r="31" fill="none" stroke="#9aa7b4" stroke-width="7"/>
    <circle cx="410" cy="468" r="31" fill="none" stroke="#cfd9e2" stroke-width="2" stroke-dasharray="3 6"/>
    <circle cx="238" cy="468" r="13" fill="#c1ccd7" stroke="#8c98a5" stroke-width="4"/>

    <!-- рама -->
    <g fill="none" stroke="url(#frame)" stroke-width="14">
      <path d="M332 340 L410 468"/>
      <path d="M338 338 L548 330"/>
      <path d="M410 468 L556 382"/>
      <path d="M548 330 L570 380"/>
      <path d="M410 468 L238 468"/>
      <path d="M330 350 L246 460"/>
    </g>
    <!-- вилка -->
    <path d="M566 380 C 584 404 596 436 606 466" fill="none" stroke="#e0e6ec" stroke-width="9"/>
    <path d="M566 380 C 584 404 596 436 606 466" fill="none" stroke="#9aa7b4" stroke-width="4"/>

    <!-- подседельный штырь и седло -->
    <path d="M332 340 L326 318" stroke="#8c98a5" stroke-width="9" fill="none"/>
    <path d="M306 316 c12-10 42-12 54-2 c-8 12-44 16-54 2 Z" fill="#4a362b" stroke="#2b1f19" stroke-width="3"/>

    <!-- руль -->
    <path d="M570 380 L572 316 c2-12 12-18 22-16" fill="none" stroke="#4d5863" stroke-width="9"/>
    <path d="M592 300 c14-4 26 2 30 12" fill="none" stroke="#2f3841" stroke-width="12"/>
    <path d="M600 306 c8-2 14 2 16 8" fill="none" stroke="#1f262d" stroke-width="8"/>

    <!-- шатун и педали -->
    <path d="M410 468 L452 516" stroke="#7c8895" stroke-width="9" fill="none"/>
    <path d="M410 468 L372 420" stroke="#96a2af" stroke-width="9" fill="none"/>
    <rect x="434" y="512" width="40" height="12" rx="6" transform="rotate(12 454 518)"
          fill="#4a5560" stroke="#2c343c" stroke-width="2"/>
    <rect x="346" y="412" width="38" height="11" rx="5" transform="rotate(14 365 417)"
          fill="#3a434c" stroke="#2c343c" stroke-width="2"/>
  </g>

  <!-- ============================= пеликан ============================= -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- хвост -->
    <!-- хвост: широкий веер с мягкими зазубринами -->
    <path d="M304 288 C 268 274 232 262 200 258 C 208 268 210 276 208 284
             C 190 288 176 296 168 306 C 184 310 196 316 202 322
             C 186 330 176 340 172 352 C 196 352 218 350 236 346
             C 260 340 284 336 304 336 Z"
          fill="url(#wing)" stroke="#2f3742" stroke-width="5" stroke-linejoin="round"/>
    <g fill="none" stroke="#c2ccd7" stroke-width="3" stroke-linecap="round">
      <path d="M282 290 C 260 282 238 274 218 268"/>
      <path d="M276 312 C 254 310 232 306 210 302"/>
      <path d="M272 334 C 254 332 236 330 216 328"/>
    </g>

    <!-- дальняя лапа -->
    <path d="M354 372 C 356 392 362 404 372 412" fill="none" stroke="#2f3742" stroke-width="17"/>
    <path d="M354 372 C 356 392 362 404 372 412" fill="none" stroke="#d98a26" stroke-width="10"/>
    <path d="M364 408 C 372 398 392 396 404 404 C 400 416 376 420 364 414 Z"
          fill="#d98a26" stroke="#2f3742" stroke-width="4"/>

    <!-- тело, шея, голова — обводка -->
    <g fill="url(#body)" stroke="#2f3742" stroke-width="6">
      <ellipse id="torso" cx="332" cy="318" rx="98" ry="76" transform="rotate(-10 332 318)"/>
      <path id="neck" d="M386 296 C 380 224 404 182 452 166 L494 212 C 458 236 444 268 448 306 Z"/>
      <circle id="head" cx="466" cy="158" r="46"/>
    </g>
    <!-- тело, шея, голова — заливка без обводки (убирает внутренние линии) -->
    <g fill="url(#body)">
      <use xlink:href="#torso" href="#torso"/>
      <use xlink:href="#neck" href="#neck"/>
      <use xlink:href="#head" href="#head"/>
    </g>

    <path d="M392 296 C 412 312 434 320 452 318" fill="none" stroke="#cdd8e2" stroke-width="4" opacity="0.9"/>

    <!-- хохолок -->
    <path d="M436 118 C 428 102 414 94 400 94 C 412 100 422 110 428 124 Z"
          fill="#f7fafc" stroke="#2f3742" stroke-width="4.5"/>
    <path d="M448 116 C 446 100 436 88 422 82 C 432 92 438 104 440 120 Z"
          fill="#f7fafc" stroke="#2f3742" stroke-width="4.5"/>
    <path d="M424 126 C 414 116 402 112 390 114 C 402 118 410 126 416 138 Z"
          fill="#f7fafc" stroke="#2f3742" stroke-width="4.5"/>

    <!-- клюв: надклювье -->
    <path d="M488 140 C 552 147 606 167 640 187 C 647 191 644 199 637 198 C 584 192 520 178 486 166 Z"
          fill="url(#bill)" stroke="#2f3742" stroke-width="5"/>
    <!-- клюв: мешок -->
    <path d="M486 166 C 497 222 533 264 580 269 C 626 274 645 226 637 190 C 588 186 520 177 486 166 Z"
          fill="url(#pouch)" stroke="#2f3742" stroke-width="5"/>
    <path d="M498 188 C 518 234 551 262 588 266" fill="none" stroke="#d97b16" stroke-width="3" opacity="0.5"/>
    <path d="M488 162 C 550 176 600 188 636 189" fill="none" stroke="#2f3742" stroke-width="3.5" opacity="0.5"/>
    <!-- ноздря -->
    <ellipse cx="522" cy="160" rx="6" ry="3.2" transform="rotate(12 522 160)" fill="#c97913" opacity="0.65"/>

    <!-- глаз -->
    <circle cx="474" cy="146" r="9" fill="#ffffff" stroke="#2f3742" stroke-width="3"/>
    <circle cx="476" cy="146" r="5" fill="#2b3340"/>
    <circle cx="473.5" cy="143.5" r="1.6" fill="#ffffff"/>

    <!-- бандана -->
    <path d="M406 196 C 424 216 452 224 472 218 L476 238 C 448 248 416 234 400 214 Z"
          fill="#ffd24a" stroke="#2f3742" stroke-width="4"/>
    <path d="M410 200 C 372 186 328 184 292 194 C 318 205 344 208 368 208
             C 348 220 330 236 320 254 C 344 240 372 224 392 213 L 408 206 Z"
          fill="#ffd24a" stroke="#2f3742" stroke-width="4" stroke-linejoin="round"/>
    <path d="M390 210 C 364 220 340 232 324 246" fill="none" stroke="#e0a92a" stroke-width="3" opacity="0.7"/>

    <!-- дальнее крыло (сложенное на спине) -->
    <path d="M290 286 C 330 254 392 268 414 302 C 408 344 356 370 306 352 C 282 336 276 304 290 286 Z"
          fill="url(#wing)" stroke="#2f3742" stroke-width="5"/>
    <g fill="none" stroke="#b3c0cd" stroke-width="3.5">
      <path d="M306 292 c 30 4 60 14 80 30"/>
      <path d="M300 314 c 28 6 56 16 74 30"/>
      <path d="M304 336 c 22 6 42 14 58 24"/>
    </g>


    <!-- ближнее крыло-рука, держит руль (сужается к «кисти») -->
    <path d="M350 292 C 396 284 446 296 484 318 C 522 340 556 332 582 304
             C 592 297 601 303 594 312 C 568 344 526 364 486 357
             C 440 350 390 340 356 333 C 344 327 342 299 350 292 Z"
          fill="url(#wing)" stroke="#2f3742" stroke-width="5"/>
    <g fill="none" stroke="#c2ccd7" stroke-width="3">
      <path d="M386 306 C 420 314 452 328 478 340"/>
      <path d="M400 326 C 428 334 454 344 476 351"/>
      <path d="M500 330 C 526 336 550 328 566 316"/>
    </g>
    <!-- «пальцы» на руле -->
    <path d="M586 302 C 600 298 612 304 614 314 C 602 322 586 318 580 310 Z"
          fill="#f7fafc" stroke="#2f3742" stroke-width="4"/>
    <path d="M592 308 L604 312" stroke="#c2ccd7" stroke-width="2.5" fill="none"/>

    <!-- ближняя лапа -->
    <path d="M356 372 C 358 400 372 428 400 448 L446 508" fill="none" stroke="#2f3742" stroke-width="19"/>
    <path d="M356 372 C 358 400 372 428 400 448 L446 508" fill="none" stroke="url(#legNear)" stroke-width="11"/>
    <path d="M372 418 C 354 408 338 410 330 420 C 344 428 360 430 374 428 Z"
          fill="#e8912c" stroke="#2f3742" stroke-width="4"/>

    <!-- перепончатая лапа на педали -->
    <path d="M436 506 C 448 496 472 498 486 510 C 480 522 456 524 440 518 Z"
          fill="#f2a23e" stroke="#2f3742" stroke-width="4"/>
    <path d="M446 504 L466 512 M452 500 L472 506" stroke="#c8761f" stroke-width="2.5" fill="none"/>
  </g>
</svg>
