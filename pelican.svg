    <circle cx="432" cy="428" r="26" fill="#F7EFE2" stroke="#3B3530" stroke-width="4"/>
    <circle cx="432" cy="428" r="11" fill="#C7BCAD" stroke="#3B3530" stroke-width="3"/>
