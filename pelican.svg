      <line x1="294.6" y1="430.1" x2="348.7" y2="456.1" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="290.7" y1="434.9" x2="328.1" y2="481.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
