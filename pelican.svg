    <g>
      <circle cx="556" cy="424" r="88" fill="none" stroke="#3B3530" stroke-width="15"/>
      <circle cx="556" cy="424" r="79" fill="none" stroke="#F7EFE2" stroke-width="6"/>
      <line x1="570.0" y1="424.0" x2="630.0" y2="424.0" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="568.6" y1="430.1" x2="622.7" y2="456.1" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="564.7" y1="434.9" x2="602.1" y2="481.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
