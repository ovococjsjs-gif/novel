        <path d="M 354 300 L 534 296"/>
        <path d="M 432 428 L 282 424"/>
        <path d="M 352 302 L 282 424"/>
        <path d="M 556 344 L 556 424"/>
        <path d="M 534 296 L 556 344"/>
