      <line x1="278.9" y1="437.6" x2="265.5" y2="496.1" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="273.3" y1="434.9" x2="235.9" y2="481.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="269.4" y1="430.1" x2="215.3" y2="456.1" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="268.0" y1="424.0" x2="208.0" y2="424.0" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="269.4" y1="417.9" x2="215.3" y2="391.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="273.3" y1="413.1" x2="235.9" y2="366.1" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="278.9" y1="410.4" x2="265.5" y2="351.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
      <line x1="285.1" y1="410.4" x2="298.5" y2="351.9" stroke="#BEB4A5" stroke-width="3" stroke-linecap="round"/>
